tickleStick:
  budget:
    maxDailySpend: 3.00          # USD — shared pool for all pipelines; raised from $1 for repo-maintenance
    maxWeeklySpend: 15.00        # USD — allows 2-3 heavy maintenance days per week
    alerts:
      - at: "80%"               # percentage of daily/weekly limit
      - at: 0.50                # absolute USD threshold
    retentionDays: 30            # auto-prune triage events older than this

  telemetry:
    enabled: true
    format: json

  pipelines:
    daily-briefing:
      tier0:
        command: "python3"
        args: ["scripts/fetch-daily-data.py"]
        timeout: 30000
      tier1:
        systemPrompt: |
          You are triaging items for a daily briefing. For each item, respond with JSON:
          {"classification": "routine"|"urgent"|"needs-reasoning"|"human", "response": "one-line summary", "confidence": 0.0-1.0}
          - routine: normal item, include summary in briefing
          - urgent: time-sensitive, needs reasoning to draft response
          - needs-reasoning: complex, needs synthesis
          - human: requires human decision (legal, financial, personal)
        confidenceThreshold: 0.7
      tier2:
        prompt: |
          You are preparing a daily briefing. Here are items that need reasoning:
          {{items}}
          Synthesize into: (1) 4-bullet executive summary, (2) BIG ROCK for the day,
          (3) any items requiring immediate attention with recommended actions.
      tier3:
        route: "main"

    repo-maintenance:
      tier0:
        command: "python3"
        args: ["scripts/repo-maintenance-gather.py"]
        timeout: 300000             # 5 minutes for 27 repos
      tier1:
        systemPrompt: |
          You are triaging repository maintenance items. Each item has a `type` field
          that provides a pre-classification. Use it as a strong hint but override if needed.

          For each item, respond with JSON:
          {"classification": "routine"|"urgent"|"needs-reasoning"|"human", "response": "one-line action summary", "confidence": 0.0-1.0}

          Classification rules:
          - routine: dependabot-safe items (auto-fixable patches), informational CI status
          - urgent: dependabot-urgent (CVE >= 7.0), production Sentry regressions, CI failures > 2 days
          - needs-reasoning: dependabot-unsafe (needs plan), multiple related issues, cross-repo impact
          - human: staging→production approvals, major version bumps, security architecture decisions

          The `type` field maps to classifications:
          - dependabot-safe → routine (auto-merge candidate)
          - dependabot-urgent → urgent (immediate attention)
          - dependabot-unsafe → needs-reasoning (needs implementation plan)
          - sentry-regression → urgent (production error)
          - stale-pr → routine (send reminder)
          - planned-fix → needs-reasoning (attempt fix)
          - ci-failure → urgent (blocking development)
        confidenceThreshold: 0.8
      tier2:
        prompt: |
          You are the repo maintenance agent. Process these classified items:
          {{items}}

          Label taxonomy:
          - type:bug, type:dependency, type:feature — what kind of work
          - status:draft → status:planned → status:approved → status:in-progress → status:staged
          - moscow:must/should/could/wont — priority
          - ONLY a human can set status:approved. Never add this label yourself.

          Execute the following actions based on classification:

          1. For "routine" dependabot-safe items:
             - Run: python3 scripts/repo-maintenance-actions.py auto-merge --repo <repo> --pr <number>
             - Report what was merged

          2. For "urgent" items:
             - Create GitHub issues with labels "type:bug,status:draft":
               python3 scripts/repo-maintenance-actions.py create-issue --repo <repo> --title "..." --body-file /tmp/body.md --labels "type:bug,status:draft"
             - Include severity, affected package, and recommended fix approach

          3. For "needs-reasoning" items:
             - For items with status:draft: write an implementation plan as a comment, then add status:planned label
             - For items with status:approved: attempt the fix, create a PR, promote to staging
             - After staging CI+e2e green: add status:staged label
             - Verify staging: python3 scripts/repo-maintenance-actions.py check-staging --repo <repo>

          4. For stale PRs:
             - Post a reminder comment on the PR

          5. For dependency alerts without PRs:
             - Create GitHub issue with labels "type:dependency,status:draft"

          After all actions, format a morning briefing with these sections:
          ## Actions Taken (auto)
          - What was merged, promoted, or created

          ## Needs Your Approval
          - Items with status:staged (on staging with green CI+e2e, awaiting production promotion)

          ## Needs Attention
          - Urgent items, CI failures, Sentry regressions with created issues

          ## Health Summary
          - X/27 repos clean, Y repos with staging drift, Z repos with CI red
          - Stale PRs count

          ## Cost & Duration
      tier3:
        route: "main"

    weekly-retro:
      tier0:
        command: "python3"
        args: ["scripts/fetch-weekly-data.py"]
        timeout: 30000
      tier1:
        systemPrompt: |
          Classify this retrospective item as JSON:
          {"classification": "routine"|"urgent"|"needs-reasoning"|"human", "response": "...", "confidence": 0.0-1.0}
          - routine: factual data point, include as-is
          - needs-reasoning: concerning trend or pattern worth analyzing
          - human: decision needed from human
        confidenceThreshold: 0.7
      tier2:
        prompt: |
          Weekly retrospective. Data:
          {{items}}
          Part 1 — Facts on the ground: costs, errors, key decisions.
          Part 2 — Retro kickoff: what went well (+), what didn't (-), what to change (delta).
      tier3:
        route: "main"

# NanoClaw-specific: optional Tier 1 model provider.
# Remove or comment out this section to use Tier 0 only (no classification).
# triageProvider:
#   provider: openai           # "openai" or "anthropic"
#   model: gpt-4o-mini         # cheap model for triage
#   apiKeyEnvVar: OPENAI_API_KEY  # which .env var holds the API key
#   # baseUrl: https://openrouter.ai/api/v1  # optional: for OpenRouter, Ollama, etc.
