tickleStick:
  tier0:
    patterns:
      - match: "^/help$"
        type: command
        action: deflect
        response: "Commands: /help, /status, /budget. For anything else, just ask!"
      - match: "^(hi|hello|hey)\\b"
        type: regex
        flags: "i"
        action: deflect
        response: "Hello! How can I help you?"
    keywords:
      - match: ["unsubscribe", "stop", "optout", "opt out"]
        action: deflect
        response: "You've been unsubscribed."
  tier1:
    systemPrompt: |
      You are a message triage classifier. Decide if this message needs the full AI agent or can be handled simply.
      Respond with JSON only: {"action": "deflect"|"escalate"|"human", "response": "...", "confidence": 0.0-1.0}
      - deflect: simple greeting, status check, or FAQ — provide the response
      - escalate: needs real thinking, context, or tool use
      - human: explicitly asks for a human or reports a serious problem
    confidenceThreshold: 0.7
  telemetry:
    enabled: true
    format: json

  # Budget caps — disable Tier 1 model calls when spend limits are reached.
  # Alerts are sent to the main group channel.
  # budget:
  #   maxDailySpend: 1.00        # USD — Tier 1 auto-disables when exceeded
  #   maxWeeklySpend: 5.00       # USD — optional weekly cap
  #   alerts:
  #     - at: "80%"              # percentage of daily/weekly limit
  #     - at: 0.50               # absolute USD threshold
  #   retentionDays: 30          # auto-prune triage events older than this

# NanoClaw-specific: optional Tier 1 model provider.
# Remove or comment out this section to use Tier 0 (deterministic) only.
# triageProvider:
#   provider: openai           # "openai" or "anthropic"
#   model: gpt-4o-mini         # cheap model for triage
#   apiKeyEnvVar: OPENAI_API_KEY  # which .env var holds the API key
#   # baseUrl: https://openrouter.ai/api/v1  # optional: for OpenRouter, Ollama, etc.
