tickleStick:
  budget:
    maxDailySpend: 1.00          # USD — override in config/private.yaml
    maxWeeklySpend: 5.00         # USD — override in config/private.yaml
    alerts:
      - at: "80%"               # percentage of daily/weekly limit
      - at: 0.50                # absolute USD threshold
    retentionDays: 30            # auto-prune triage events older than this

  telemetry:
    enabled: true
    format: json

  pipelines:
    # ── Email triage: continuous processing (every 5 min) ────────────────
    # Processes new emails immediately: classify, reason, draft/reply-all,
    # label, and send urgent Slack DMs. No synthesis — that's daily-briefing's job.
    email-triage:
      stages:
        - name: gather
          type: script
          command: "python3"
          args: ["scripts/fetch-daily-data.py"]
          timeout: 30000

        - name: classify
          type: model
          provider: cheap
          systemPrompt: "$file:config/prompts/email-triage-classify.md"
          confidenceThreshold: 1.0
          postHook:
            command: "python3"
            args: ["scripts/apply-spam-labels.py"]

        - name: reason
          type: model
          provider: expensive
          input: "classified:needs-reasoning,classified:urgent"
          prompt: "$file:config/prompts/email-triage-reason.md"
          postHook:
            command: "python3"
            args: ["scripts/apply-draft-labels.py"]

        - name: post-deliver
          type: callback

    # ── Daily briefing: synthesis only (6 AM) ─────────────────────────────
    # Summarizes what email-triage already processed. No classify/reason —
    # that work is done continuously by the email-triage pipeline.
    daily-briefing:
      stages:
        - name: gather
          type: script
          command: "python3"
          args: ["scripts/fetch-daily-data.py", "--triage-summary"]
          timeout: 30000

        - name: synthesize
          type: model
          provider: expensive
          input: "all"
          prompt: "$file:config/prompts/daily-briefing-synthesize.md"

        - name: post-deliver
          type: callback

    # ── Repo maintenance: phased pipeline ──────────────────────────────────
    # Phase flow: preflight (cleanup) → triage → plan → execute → report
    # Each phase is a separate pipeline, orchestrated by task-scheduler.ts.
    # Trigger: "pipeline:repo-maintenance" runs all phases.
    #          "pipeline:repo-maintenance --phases triage,execute --repos Owner/repo" for selective.

    repo-maintenance-triage:
      stages:
        - name: gather
          type: script
          command: "python3"
          args: ["scripts/repo-maintenance-gather.py", "--tier", "auto", "--preflight-done"]
          timeout: 300000             # 5 minutes for 27 repos

        - name: classify
          type: model
          provider: cheap
          systemPrompt: "$file:config/prompts/repo-triage-classify.md"
          confidenceThreshold: 0.8

        - name: triage
          type: model
          provider: expensive
          prompt: "$file:config/prompts/repo-triage-triage.md"

        - name: escalate
          type: callback

    repo-maintenance-plan:
      stages:
        - name: plan
          type: model
          provider: expensive
          prompt: "$file:config/prompts/repo-plan.md"

        - name: escalate
          type: callback

    repo-maintenance-execute:
      stages:
        - name: execute
          type: model
          provider: expensive
          prompt: "$file:config/prompts/repo-execute.md"

        - name: escalate
          type: callback

    weekly-retro:
      stages:
        - name: gather
          type: script
          command: "python3"
          args: ["scripts/fetch-weekly-data.py"]
          timeout: 30000

        - name: classify
          type: model
          provider: cheap
          systemPrompt: "$file:config/prompts/weekly-retro-classify.md"
          confidenceThreshold: 0.7

        - name: synthesize
          type: model
          provider: expensive
          input: "all"
          prompt: "$file:config/prompts/weekly-retro-synthesize.md"

        - name: escalate
          type: callback

# NanoClaw-specific: optional Tier 1 model provider.
# Comment out this section to use script stages only (no classification).
triageProvider:
  provider: anthropic
  model: claude-haiku-4-5
  apiKeyEnvVar: ANTHROPIC_API_KEY
  # baseUrl: https://openrouter.ai/api/v1  # optional: for OpenRouter, Ollama, etc.
